name: Sync upstream

on:
  schedule:
    # Twice a day at off-peak minutes: GitHub's best-effort scheduler was
    # delaying runs by hours and then dropping every slot for two days.
    - cron: '37 3,15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.merge.outputs.pushed }}
      sha: ${{ steps.merge.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: merge
        name: Merge upstream main into this fork's main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pengchujin/aerial-tv.git
          git fetch upstream main
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          if [ "$BEHIND" -eq 0 ]; then
            echo "Upstream has nothing new."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Upstream has $BEHIND new commit(s); merging..."
          git merge upstream/main --no-edit
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # A push made with GITHUB_TOKEN does not trigger workflows (recursion
  # prevention), so the build is called here instead of relying on push.
  build:
    needs: sync
    if: needs.sync.outputs.pushed == 'true'
    uses: ./.github/workflows/build.yml
    # A reusable workflow pins to the caller's commit — the one the schedule
    # fired on, i.e. BEFORE the merge was pushed — so pass the new SHA or the
    # build produces a stale APK every time.
    with:
      ref: ${{ needs.sync.outputs.sha }}
    permissions:
      contents: write
    # Reusable workflows do NOT inherit secrets by default; without this the
    # signing key decodes to a 0-byte file and the build fails at packaging
    # with an opaque DER error after several minutes.
    secrets: inherit
